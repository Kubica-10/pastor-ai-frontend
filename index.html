<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastor AI - Assistente Teológico</title>
    <!-- 1. Carrega o Tailwind CSS para o design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilo para a barra de rolagem */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background-color: #d1d5db; /* gray-400 */
            border-radius: 3px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background-color: #f3f4f6; /* gray-100 */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen p-4">

    <!-- Janela Principal do Chat -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col" style="height: 85vh; max-height: 700px;">
        
        <!-- Cabeçalho -->
        <header class="bg-blue-600 text-white p-5 rounded-t-2xl shadow-lg text-center">
            <h1 class="text-2xl font-bold">Pastor AI</h1>
            <p class="text-sm opacity-90">Seu assistente teológico 24/7</p>
        </header>

        <!-- Área de Mensagens -->
        <main id="chat-messages" class="flex-1 p-6 space-y-4 overflow-y-auto bg-gray-50">
            <!-- Mensagem inicial do Bot -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-xs shadow">
                    <p>Olá! Sou o Pastor AI. Como posso ajudá-lo a entender melhor as Escrituras hoje?</p>
                </div>
            </div>
        </main>

        <!-- Área de Digitação -->
        <footer class="p-4 border-t border-gray-200 bg-white rounded-b-2xl">
            <div class="flex space-x-3">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Digite sua pergunta..."
                    class="flex-1 border border-gray-300 rounded-full py-3 px-5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                >
                <button 
                    id="send-button" 
                    class="bg-blue-600 text-white rounded-full p-3 shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition transform hover:scale-105 active:scale-95"
                >
                    <!-- Ícone de Enviar (SVG) -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.875L6 12z" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // --- 2. Lógica do JavaScript ---

        // IMPORTANTE: Coloque a URL da sua API do Render aqui
        // Certifique-se que termina com a barra "/"
        const API_URL = "https://pastor-ai.onrender.com/gerar_conteudo/";

        // Elementos do HTML
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // Função para adicionar uma mensagem na tela
        function addMessage(message, sender, messageId = null) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('flex');
            
            let content = '';
            
            if (sender === 'user') {
                messageElement.classList.add('justify-end');
                content = `
                    <div class="bg-blue-500 text-white p-3 rounded-lg max-w-xs shadow">
                        <p>${message}</p>
                    </div>
                `;
            } else {
                messageElement.classList.add('justify-start');
                content = `
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-xs shadow">
                        <p>${message}</p>
                    </div>
                `;
                // Adiciona uma classe "verses" para estilização futura, se quisermos
                if (messageId === 'verses') {
                    content = `
                    <div class="bg-gray-100 border border-gray-200 text-gray-700 p-3 rounded-lg max-w-xs shadow-inner mt-2">
                        <p class="font-medium text-sm">Versículos de apoio:</p>
                        <div class="text-sm mt-1 whitespace-pre-wrap">${message}</div>
                    </div>
                `;
                }
            }
            
            if (messageId) {
                messageElement.id = messageId;
            }

            messageElement.innerHTML = content;
            chatMessages.appendChild(messageElement);
            
            // Rola para a mensagem mais recente
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Função para exibir o indicador de "digitando..."
        function showLoading() {
            addMessage(
                '<div class="flex items-center space-x-1">' +
                    '<div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: -0.3s;"></div>' +
                    '<div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: -0.15s;"></div>' +
                    '<div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>' +
                '</div>', 
                'bot', 
                'loading-indicator'
            );
        }

        // Função para remover o indicador de "digitando..."
        function hideLoading() {
            const loading = document.getElementById('loading-indicator');
            if (loading) {
                loading.remove();
            }
        }

        // Função principal para enviar a mensagem
        async function handleSendMessage() {
            const query = userInput.value.trim();
            if (!query) return; // Não envia mensagens vazias

            // 1. Mostra a mensagem do usuário na tela
            addMessage(query, 'user');
            userInput.value = ''; // Limpa o campo
            userInput.disabled = true;
            sendButton.disabled = true;
            
            // 2. Mostra o indicador "digitando..."
            showLoading();

            try {
                // 3. Chama a sua API (o Backend)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                hideLoading();

                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.statusText}`);
                }

                const data = await response.json();

                // 4. Exibe a resposta principal do Bot
                addMessage(data.resposta_baseada_na_biblia, 'bot');
                
                // 5. Exibe os versículos de apoio (se houver)
                if (data.versiculos_encontrados && data.versiculos_encontrados.length > 0) {
                    // Formata os versículos para exibição
                    const versesText = data.versiculos_encontrados
                                         .join('\n')
                                         .replace(/Linha \d+:/g, '•'); // Limpa o 'Linha ...:'
                    addMessage(versesText, 'bot', 'verses');
                }
                
                // 6. (Bônus) Exibe a oração sugerida
                 if (data.oracao_sugestao) {
                    addMessage(`<em>"${data.oracao_sugestao}"</em>`, 'bot');
                }

            } catch (error) {
                console.error("Erro ao chamar a API:", error);
                hideLoading();
                addMessage("Desculpe, ocorreu um erro. Não consegui me conectar ao meu cérebro. Tente novamente mais tarde.", 'bot');
            } finally {
                // Reabilita o campo de digitação e o botão
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        // --- 3. Event Listeners ---
        
        // Envia ao clicar no botão
        sendButton.addEventListener('click', handleSendMessage);
        
        // Envia ao pressionar "Enter"
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                handleSendMessage();
            }
        });

    </script>
</body>
</html>
