<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastor AI - Assistente Teológico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        #chat-messages::-webkit-scrollbar { width: 6px; }
        #chat-messages::-webkit-scrollbar-thumb { background-color: #d1d5db; border-radius: 3px; }
        #chat-messages::-webkit-scrollbar-track { background-color: #f3f4f6; }
        #chat-app { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen p-4">

    <div id="login-screen" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-10 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-red-500 mx-auto mb-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Acesso Negado</h1>
        <p class="text-gray-600">Este é um serviço privado. Por favor, utilize o link de acesso exclusivo que foi fornecido a você.</p>
        <p class="text-sm text-gray-400 mt-6">Se você é um cliente e seu link parou de funcionar, entre em contato com o suporte.</p>
    </div>

    <div id="chat-app" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg flex flex-col" style="height: 85vh; max-height: 700px;">
        <header class="bg-blue-600 text-white p-5 rounded-t-2xl shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold">Pastor AI</h1>
                <p class="text-sm opacity-90">Assistente Teológico</p>
            </div>
            <div class="flex space-x-2">
                <button id="clear-button" title="Limpar Chat" class="p-2 rounded-full hover:bg-blue-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12.578 0a48.108 48.108 0 013.478-.397m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                </button>
                <button id="pdf-button" title="Salvar em PDF" class="p-2 rounded-full hover:bg-blue-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                </button>
            </div>
        </header>

        <main id="chat-messages" class="flex-1 p-6 space-y-4 overflow-y-auto bg-gray-50">
            </main>

        <footer class="p-4 border-t border-gray-200 bg-white rounded-b-2xl">
            <div class="flex space-x-3">
                <input type="text" id="user-input" placeholder="Digite sua pergunta..." class="flex-1 border border-gray-300 rounded-full py-3 px-5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                <button id="send-button" class="bg-blue-600 text-white rounded-full p-3 shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition transform hover:scale-105 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.875L6 12z" /></svg>
                </button>
            </div>
        </footer>
    </div>


    <script>
        // ######################################################
        // ### 1. DEFINIÇÕES GLOBAIS ###
        // ######################################################

        // ⚠️ MUDE ESTA URL QUANDO O HUGGINGFACE ESTIVER RODANDO!
        const API_URL = "https://kubicasouza-pastor-ai.hf.space/gerar_conteudo/";
        
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const clearButton = document.getElementById('clear-button');
        const pdfButton = document.getElementById('pdf-button');
        
        const welcomeMessage = `
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-xs shadow">
                    <p>Olá! Sou o Pastor AI. Está preparado para a palavra? Pergunte-me algo!</p>
                </div>
            </div>`;

        // Lista de tokens válidos
        const validTokens = [
            "IGREJABATISTA_SECRETO_123",
            "PASTORJOAO_ABC_999",
            "MEU_TOKEN_PESSOAL_TESTE",
        ];


        // ######################################################
        // ### 2. LÓGICA DE AUTENTICAÇÃO ###
        // ######################################################
        
        (function checkAccess() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (token && validTokens.includes(token)) {
                console.log("Acesso Concedido.");
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-app').style.display = 'flex';
                initializeChat();
            } else {
                console.log("Acesso Negado. Token inválido ou ausente.");
            }
        })();


        // ######################################################
        // ### 3. LÓGICA DO CHAT ###
        // ######################################################

        function initializeChat() {
            chatMessages.innerHTML = welcomeMessage;
            userInput.value = '';
        }

        function addMessage(message, sender, messageId = null) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('flex', 'mb-4'); 
            
            let content = '';
            if (sender === 'user') {
                messageElement.classList.add('justify-end');
                content = `<div class="bg-blue-500 text-white p-3 rounded-lg max-w-xs shadow"><p>${message}</p></div>`;
            } else {
                messageElement.classList.add('justify-start');
                message = message.replace(/\n/g, '<br>');
                content = `<div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-xs shadow"><p>${message}</p></div>`;
                if (messageId === 'verses') {
                    content = `<div class="bg-gray-100 border border-gray-200 text-gray-700 p-3 rounded-lg max-w-xs shadow-inner mt-2"><p class="font-medium text-sm">Versículos de apoio:</p><div class="text-sm mt-1 whitespace-pre-wrap">${message}</div></div>`;
                }
            }
            if (messageId) messageElement.id = messageId;
            messageElement.innerHTML = content;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showLoading() {
            addMessage('<div class="flex items-center space-x-1"><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: -0.3s;"></div><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce" style="animation-delay: -0.15s;"></div><div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div></div>', 'bot', 'loading-indicator');
        }

        function hideLoading() {
            const loading = document.getElementById('loading-indicator');
            if (loading) loading.remove();
        }

        async function handleSendMessage() {
            const query = userInput.value.trim();
            if (!query) return; 

            addMessage(query, 'user');
            userInput.value = ''; 
            userInput.disabled = true;
            sendButton.disabled = true;
            
            showLoading();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                hideLoading();
                if (!response.ok) throw new Error(`Erro na API: ${response.statusText}`);
                const data = await response.json();
                addMessage(data.resposta_baseada_na_biblia, 'bot');
                if (data.versiculos_encontrados && data.versiculos_encontrados.length > 0) {
                    const versesText = data.versiculos_encontrados.join('\n').replace(/Linha \d+:/g, '•'); 
                    addMessage(versesText, 'bot', 'verses');
                }
                 if (data.oracao_sugestao) {
                    addMessage(`<em>"${data.oracao_sugestao}"</em>`, 'bot');
                }
            } catch (error) {
                console.error("Erro ao chamar a API:", error);
                hideLoading();
                addMessage("Desculpe, ocorreu um erro. Não consegui me conectar ao meu cérebro. Tente novamente mais tarde.", 'bot');
            } finally {
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }
        
        function handleSavePDF() {
            const chatContent = document.getElementById('chat-messages');
            const options = { margin: 1, filename: 'pastor_ai_conversa.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } };
            html2pdf().set(options).from(chatContent).save();
        }

        // ######################################################
        // ### 4. EVENT LISTENERS ###
        // ######################################################
        
        sendButton.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') handleSendMessage(); });
        clearButton.addEventListener('click', initializeChat);
        pdfButton.addEventListener('click', handleSavePDF);
        
    </script>
</body>
</html>
